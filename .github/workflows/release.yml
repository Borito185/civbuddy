name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: github.repository == 'Borito185/civbuddy'
    runs-on: ubuntu-latest

    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic Release
        run: >
          npx --yes semantic-release@25.0.9
          --branches main
          --tag-format 'v${version}'
          --plugins
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract released version
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          VERSION="${TAG#v}"
          
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build mod JAR
        run: ./gradlew -S -i -Pmod_version="${MOD_VERSION}" assemble

      - name: Store JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/*.jar


  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: build/libs

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: CivBuddy ${{ needs.release.outputs.version }}

          modrinth-id: TvWyaX7o
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1373036
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
