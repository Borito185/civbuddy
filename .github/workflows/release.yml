name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-and-publish:
    if: github.repository == 'Borito185/civbuddy'

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic Release
        run: >
          npx --yes semantic-release@25.0.9
          --branches main
          --tag-format 'v${version}'
          --plugins
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/github

      - name: Extract released version
        run: |
          set -euo pipefail

          TAG="$(git describe --tags --abbrev=0)"
          MOD_VERSION="${TAG#v}"

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "MOD_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build mod JAR
        run: ./gradlew -S -i -Pmod_version="${MOD_VERSION}" assemble

      - name: Publish to Modrinth, CurseForge & GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: CivBuddy ${{ env.MOD_VERSION }}

          # Modrinth
          modrinth-id: TvWyaX7o
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # CurseForge
          curseforge-id: 1373036
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # GitHub
          github-token: ${{ secrets.GITHUB_TOKEN }}
